name: Peekdown
options:
  bundleIdPrefix: com.markdownpreview
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "21"

packages:
  NativeSupport:
    path: .

targets:
  Peekdown:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: ThirdParty
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: Peekdown/Resources
        buildPhase: resources
      - path: Peekdown
        excludes:
          - "Info.plist"
          - "*.entitlements"
          - "Resources"
    info:
      path: Peekdown/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSPrincipalClass: NSApplication
        CFBundleIconFile: Peekdown.icns
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: None
            LSHandlerRank: None
            CFBundleTypeExtensions: [md, markdown, mdown, mkd, mkdn]
            LSItemContentTypes: [net.daringfireball.markdown, public.markdown]
          - CFBundleTypeName: YAML Document
            CFBundleTypeRole: None
            LSHandlerRank: None
            CFBundleTypeExtensions: [yaml, yml]
            LSItemContentTypes: [public.yaml]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn]
              public.mime-type: text/markdown
          - UTTypeIdentifier: com.markdownpreview.mdx
            UTTypeDescription: MDX document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [mdx]
    entitlements:
      path: Peekdown/Peekdown.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.application-groups: [7ZH96S5LF4.com.markdownpreview.shared]
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    dependencies:
      - target: PreviewExtension
        embed: true
        codeSign: true
      - target: ThumbnailExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markdownpreview.app
        PRODUCT_NAME: Peekdown

  PreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Shared
      - path: PreviewExtension
        excludes:
          - "Info.plist"
          - "*.entitlements"
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Peekdown Preview
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSExtension:
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportedContentTypes: [net.daringfireball.markdown, public.markdown, com.markdownpreview.mdx, public.yaml]
            QLSupportsSearchableItems: false
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PreviewViewController"
    entitlements:
      path: PreviewExtension/PreviewExtension.entitlements
      properties:
        com.apple.security.application-groups: [7ZH96S5LF4.com.markdownpreview.shared]
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    dependencies:
      - package: NativeSupport
        product: PeekdownNativeSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markdownpreview.app.preview
        PRODUCT_NAME: PreviewExtension
        SKIP_INSTALL: YES

  ThumbnailExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Shared
      - path: ThumbnailExtension
        excludes:
          - "Info.plist"
          - "*.entitlements"
    info:
      path: ThumbnailExtension/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Peekdown Thumbnail
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSExtension:
          NSExtensionAttributes:
            QLSupportedContentTypes: [net.daringfireball.markdown, public.markdown, com.markdownpreview.mdx]
            QLThumbnailMinimumDimension: 0
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ThumbnailProvider"
    entitlements:
      path: ThumbnailExtension/ThumbnailExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markdownpreview.app.thumbnail
        PRODUCT_NAME: ThumbnailExtension
        SKIP_INSTALL: YES

schemes:
  Peekdown:
    build:
      targets:
        Peekdown: all
    run:
      config: Debug
    archive:
      config: Release
