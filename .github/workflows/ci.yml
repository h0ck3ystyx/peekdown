name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      
      - name: Build application
        run: ./build.sh
        env:
          APPLICATION_IDENTITY: "-"
          VERSION: "1.0"
          BUILD_NUMBER: "${{ github.run_number }}"
      
      - name: Run tests
        run: |
          xcrun swiftc -O -emit-executable -module-name Tests \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -target arm64-apple-macos12.0 \
            -o build/test-runner \
            -framework AppKit -framework QuickLookUI \
            Shared/MarkdownText.swift \
            Shared/RenderingConstants.swift \
            PreviewExtension/MarkdownRenderer.swift \
            PreviewExtension/PreviewViewController.swift \
            Tests/main.swift
          ./build/test-runner
      
      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 build/local/Peekdown.app

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
