name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-versions:
    name: Validate Version Consistency
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      
      - name: Validate version consistency
        run: |
          ./scripts/sync-version.sh --check
          python3 Tests/test_versions.py

  test:
    name: Build and Test
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      
      - name: Build application
        run: ./build.sh
        env:
          APPLICATION_IDENTITY: "-"
      
      - name: Run tests
        run: |
          xcrun swiftc -O -emit-executable -module-name Tests \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -target arm64-apple-macos12.0 \
            -o build/test-runner \
            -framework AppKit -framework QuickLookUI \
            Shared/MarkdownText.swift \
            Shared/RenderingConstants.swift \
            PreviewExtension/MarkdownRenderer.swift \
            PreviewExtension/PreviewViewController.swift \
            Tests/main.swift
          ./build/test-runner
      
      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 build/local/Peekdown.app
      
      - name: Verify built version
        run: |
          source scripts/version.sh
          BUILT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/local/Peekdown.app/Contents/Info.plist)
          
          echo "Expected version: $VERSION"
          echo "Built app version: $BUILT_VERSION"
          
          if [ "$VERSION" != "$BUILT_VERSION" ]; then
            echo "❌ Error: Built app version ($BUILT_VERSION) doesn't match VERSION file ($VERSION)"
            exit 1
          fi
          
          for bundle in build/local/Peekdown.app build/local/Peekdown.app/Contents/PlugIns/*.appex; do
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Contents/Info.plist")" = "$VERSION"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$bundle/Contents/Info.plist")" = "$BUILD_NUMBER"
          done

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
