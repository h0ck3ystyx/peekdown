name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-versions:
    name: Validate Version Consistency
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      
      - name: Validate version consistency
        run: |
          set -e
          
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"
          
          # Check project.yml
          MARKETING_VERSION=$(grep 'MARKETING_VERSION:' project.yml | sed 's/.*MARKETING_VERSION: "\(.*\)"/\1/')
          echo "project.yml MARKETING_VERSION: $MARKETING_VERSION"
          
          if [ "$VERSION" != "$MARKETING_VERSION" ]; then
            echo "❌ Error: VERSION file ($VERSION) doesn't match project.yml MARKETING_VERSION ($MARKETING_VERSION)"
            echo "Run: ./scripts/sync-version.sh"
            exit 1
          fi
          
          # Check Packaging plist files
          for plist in Packaging/App-Info.plist Packaging/PreviewExt-Info.plist Packaging/ThumbExt-Info.plist; do
            PLIST_VERSION=$(grep -A1 'CFBundleShortVersionString' "$plist" | tail -1 | sed 's/.*<string>\(.*\)<\/string>/\1/' | tr -d '[:space:]')
            echo "$plist: $PLIST_VERSION"
            
            if [ "$VERSION" != "$PLIST_VERSION" ]; then
              echo "❌ Error: VERSION file ($VERSION) doesn't match $plist ($PLIST_VERSION)"
              echo "Run: ./scripts/sync-version.sh"
              exit 1
            fi
          done
          
          echo "✓ All version strings are consistent with VERSION file"

  test:
    name: Build and Test
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: latest-stable
      
      - name: Build application
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          ./build.sh
        env:
          APPLICATION_IDENTITY: "-"
          BUILD_NUMBER: "${{ github.run_number }}"
      
      - name: Run tests
        run: |
          xcrun swiftc -O -emit-executable -module-name Tests \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -target arm64-apple-macos12.0 \
            -o build/test-runner \
            -framework AppKit -framework QuickLookUI \
            Shared/MarkdownText.swift \
            Shared/RenderingConstants.swift \
            PreviewExtension/MarkdownRenderer.swift \
            PreviewExtension/PreviewViewController.swift \
            Tests/main.swift
          ./build/test-runner
      
      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 build/local/Peekdown.app
      
      - name: Verify built version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          BUILT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/local/Peekdown.app/Contents/Info.plist)
          
          echo "Expected version: $VERSION"
          echo "Built app version: $BUILT_VERSION"
          
          if [ "$VERSION" != "$BUILT_VERSION" ]; then
            echo "❌ Error: Built app version ($BUILT_VERSION) doesn't match VERSION file ($VERSION)"
            exit 1
          fi
          
          echo "✓ Build successful with correct version"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
